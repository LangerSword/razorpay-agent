[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "razorpay-agent"
version = "0.1.0"
description = "Merchant-side decisioning agent: every money action explainable, bounded, and gated."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "numpy>=1.26",
    "razorpay>=1.4",
    "matplotlib>=3.8",
    "httpx2>=2.12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.14"
ignore_missing_imports = true
follow_imports = "skip"
allow_untyped_defs = true
check_untyped_defs = false
warn_unused_ignores = false
warn_return_any = false
exclude = ["demo", "tests", ".venv"]
