<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Common</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        font-family: 'Inter', system-ui, sans-serif;
        background: #ffffff;
        color: #1a1a1a;
        min-height: 100vh;
      }
      .intro {
        position: fixed;
        inset: 0;
        background: #0a0a0a;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 24px;
        animation: intro-fade 0.6s ease 1.4s forwards;
      }
      .intro-logo {
        width: 56px;
        height: 56px;
        background: #FF4000;
        border-radius: 14px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 22px;
        color: #fff;
        font-weight: 700;
        animation: logo-pop 0.5s ease;
      }
      .intro-text {
        font-size: 13px;
        color: #999;
        font-weight: 500;
        letter-spacing: 0.3px;
        opacity: 0;
        animation: text-in 0.4s ease 0.5s forwards;
      }
      .intro-bar {
        width: 80px;
        height: 2px;
        background: rgba(255,255,255,0.1);
        border-radius: 1px;
        overflow: hidden;
        opacity: 0;
        animation: text-in 0.4s ease 0.7s forwards;
      }
      .intro-bar::after {
        content: '';
        display: block;
        width: 100%;
        height: 100%;
        background: #FF4000;
        border-radius: 1px;
        animation: bar-fill 0.7s ease 0.7s forwards;
        transform: scaleX(0);
        transform-origin: left;
      }
      @keyframes logo-pop {
        0% { transform: scale(0.8); opacity: 0; }
        60% { transform: scale(1.05); }
        100% { transform: scale(1); opacity: 1; }
      }
      @keyframes text-in {
        from { opacity: 0; transform: translateY(6px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes bar-fill {
        from { transform: scaleX(0); }
        to { transform: scaleX(1); }
      }
      @keyframes intro-fade {
        to { opacity: 0; pointer-events: none; visibility: hidden; }
      }
      #root {
        opacity: 0;
        animation: root-in 0.5s ease 1.6s forwards;
      }
      @keyframes root-in {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: translateY(0); }
      }
    </style>
    <script type="module" crossorigin src="/assets/index-85WyjTBk.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-Bhg9Lf-z.css">
  </head>
  <body>
    <div class="intro" id="intro">
      <div class="intro-logo">C</div>
      <div class="intro-text">Common</div>
      <div class="intro-bar"></div>
    </div>
    <div id="root"></div>
  </body>
</html>
